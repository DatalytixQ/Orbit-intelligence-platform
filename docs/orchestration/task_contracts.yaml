# Task Contracts v1
# Explicit interface definitions for tasks in execution_manifest.yaml

tasks:
  N001:
    id: "N001"
    owner: "Database Agent"
    purpose: "Define RLS policies on clients + app_users"
    prerequisites: []
    inputs: ["public.clients", "public.app_users"]
    outputs: ["sql/rls_clients_app_users_apply.sql", "sql/rls_clients_app_users_rollback.sql"]
    artifacts: ["n001_execution_report.md", "n001_validation.md"]
    files_to_update: []
    validation_criteria: "SELECT counts match; unauthorized queries return 0 rows."
    rollback_strategy: "Execute rls_clients_app_users_rollback.sql"
    resume_point: "If interrupted, check if policies exist in pg_policies."
    human_gate: "execution"
    completion_conditions: "All policies created and validation passes."
    model_class: "Flash"
    estimated_tokens: 15000
    checkpoint_transition: "Update checkpoint_state and execution_log"
    context: "auto"
    preferred_model: "Pro"
    fallback_model: "Flash"
    forbidden_models: ["Lite"]
    reason: "Standard complex logic routing"

  N002:
    id: "N002"
    owner: "Database Agent"
    purpose: "Define RLS policies on all 27 domain tables"
    prerequisites: ["N001"]
    inputs: ["public.sales", "public.inventory", "etc"]
    outputs: ["sql/n002_phase*_apply.sql", "sql/n002_phase*_rollback.sql"]
    artifacts: ["n002_phase*_execution_report.md", "n002_phase*_validation.md"]
    files_to_update: []
    validation_criteria: "76 policies exist (Phases 1-2). Backend access unaffected."
    rollback_strategy: "Execute phase-specific rollback.sql"
    resume_point: "Count policies in pg_policies to determine which phase to resume."
    human_gate: "execution (before Phase 3)"
    completion_conditions: "116 total policies created and validated."
    model_class: "Pro"
    estimated_tokens: 30000
    checkpoint_transition: "Update checkpoint_state and execution_log"
    context: "auto"
    preferred_model: "Pro"
    fallback_model: "Flash"
    forbidden_models: ["Lite"]
    reason: "Standard complex logic routing"

